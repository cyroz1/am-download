name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and package macOS app
        shell: bash
        run: |
          chmod +x build-app.sh
          ./build-app.sh
          ditto -c -k --sequesterRsrc --keepParent \
            "build/AM Download.app" \
            "build/AM-Download-macos-arm64.zip"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          if-no-files-found: error
          path: build/AM-Download-macos-arm64.zip

  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build app and installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD "build\release"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          Copy-Item -LiteralPath "build\windows\AMDownload.exe" `
            -Destination (Join-Path $releaseDirectory "AMDownload-windows-x64.exe") -Force
          Copy-Item -LiteralPath "build\installer\AMDownloadSetup.exe" `
            -Destination (Join-Path $releaseDirectory "AMDownloadSetup-windows-x64.exe") -Force
          Compress-Archive -LiteralPath (Join-Path $releaseDirectory "AMDownload-windows-x64.exe") `
            -DestinationPath (Join-Path $releaseDirectory "AMDownload-windows-x64.zip") -Force

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          if-no-files-found: error
          path: build/release/*

  release:
    name: Create GitHub release
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.0.0."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate asset checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "AM Download $TAG_NAME" \
            --generate-notes
